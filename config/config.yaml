data:
  dataset_path: "data/"
  sample_ratio: 0.1  # Use 10% of data for faster training
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

preprocessing:
  num_dense_features: 13
  num_sparse_features: 26
  min_frequency: 10  # Minimum frequency for categorical features

retrieval:
  top_k_candidates: 100  # Number of candidates to retrieve
  embedding_dim: 16

features:
  cross_features: true
  statistical_features: true

ranking:
  model_type: "deepfm"  # Options: "lr", "fm", "deepfm", "xgboost", "lightgbm"
  embedding_dim: 8
  hidden_dims: [256, 128, 64]
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 2048
  epochs: 5

auction:
  mechanism: "gsp"  # Generalized Second Price
  reserve_price: 0.01
  quality_weight: 0.5  # Weight for quality score vs bid

display:
  top_n: 10  # Number of ads to display
  show_metrics: true
